openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: waitlist
    description: Auryx launch waitlist and early-adopter eligibility
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /waitlist/register:
    post:
      operationId: registerWaitlist
      tags: [waitlist]
      summary: Register an email for the Auryx launch waitlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitlistRegistrationInput"
      responses:
        "200":
          description: Registration accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistRegistrationResponse"
        "400":
          description: Invalid registration
        "429":
          description: Too many requests
        "502":
          description: Verification email could not be delivered
  /waitlist/stats:
    get:
      operationId: getWaitlistStats
      tags: [waitlist]
      summary: Get public waitlist confirmation statistics
      description: Returns aggregate waitlist counts only; no email addresses or personal data are exposed.
      responses:
        "200":
          description: Public waitlist statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistStats"
  /waitlist/confirm/{token}:
    get:
      operationId: confirmWaitlistEmail
      tags: [waitlist]
      summary: Confirm a waitlist email address
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 64
            maxLength: 64
            pattern: "^[a-fA-F0-9]{64}$"
      responses:
        "200":
          description: Confirmation result page
          content:
            text/html:
              schema:
                type: string
        "410":
          description: Expired or already used confirmation link
  /waitlist/me:
    get:
      operationId: getMyWaitlistEligibility
      tags: [waitlist]
      summary: Get the signed-in user's launch discount eligibility
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Waitlist eligibility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistEligibility"
        "401":
          description: Authentication required
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    WaitlistRegistrationInput:
      type: object
      required: [email, privacyAccepted]
      properties:
        email:
          type: string
          maxLength: 320
          pattern: "^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$"
        privacyAccepted:
          type: boolean
          const: true
        source:
          type: string
          maxLength: 80
          default: landing-page
    WaitlistRegistrationResponse:
      type: object
      required: [accepted, message]
      properties:
        accepted:
          type: boolean
        message:
          type: string
        alreadyConfirmed:
          type: boolean
        eligible:
          type: boolean
          description: True only when the email has confirmed a place in the first 500.
        discountPercent:
          type: integer
          minimum: 0
          maximum: 100
    WaitlistStats:
      type: object
      required: [confirmedCount, discountSpotsRemaining, discountLimit]
      properties:
        confirmedCount:
          type: integer
          minimum: 0
          description: Number of waitlist emails confirmed so far.
        discountSpotsRemaining:
          type: integer
          minimum: 0
          maximum: 500
          description: Remaining confirmed places eligible for the launch discount.
        discountLimit:
          type: integer
          const: 500
          description: Total number of launch-discount places.
    WaitlistEligibility:
      type: object
      required: [confirmed, eligible, discountPercent]
      properties:
        confirmed:
          type: boolean
        eligible:
          type: boolean
        confirmationRank:
          type: ["integer", "null"]
        discountPercent:
          type: integer
          minimum: 0
          maximum: 100
        planPrices:
          type: object
          required: [monthly, annual]
          properties:
            monthly:
              type: number
              example: 5.99
            annual:
              type: number
              example: 45.99
    securitySchemes:
      bearerAuth:
        type: http
        scheme: bearer
        bearerFormat: JWT

