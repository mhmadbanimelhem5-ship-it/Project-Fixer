name: Deploy Auryx Landing
on:
  push:
    branches: ["main"]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Auryx Landing
        env:
          PORT: 3000
          BASE_PATH: /
        run: |
          cd artifacts/auryx-landing
          pnpm install --no-frozen-lockfile
          pnpm run build
          echo "getauryx.com" > dist/public/CNAME
          echo "getauryx.com" > dist/CNAME
          ls -la dist/public
          cat dist/public/index.html | head -20
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./artifacts/auryx-landing/dist/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
